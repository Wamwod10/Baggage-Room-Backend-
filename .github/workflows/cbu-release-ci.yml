name: CBU FX backend checks
on:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Diagnose official CBU endpoint reachability
        run: |
          node - <<'NODE'
          (async () => {
            const paths = [
              'https://cbu.uz/uz/arkhiv-kursov-valyut/json/all/2026-10-28/',
              'https://cbu.uz/uz/arkhiv-kursov-valyut/json/',
              'https://www.cbu.uz/uz/arkhiv-kursov-valyut/json/',
              'https://cbu.uz/ru/arkhiv-kursov-valyut/json/',
            ];
            for (const url of paths) {
              try {
                const res = await fetch(url, { signal: AbortSignal.timeout(6000), headers: { Accept: 'application/json' } });
                const body = await res.text();
                const json = JSON.parse(body);
                console.log(new URL(url).host + new URL(url).pathname,
                  'status', res.status, 'jsonArray', Array.isArray(json),
                  'RUBRate', json.find?.((item) => item.Ccy === 'RUB')?.Rate ?? 'missing');
              } catch (e) {
                console.log(new URL(url).host + new URL(url).pathname, 'failed',
                  e.name, e.cause?.code || e.code || e.message);
              }
            }
          })().catch((error) => { console.error(error.message); process.exitCode = 1; });
          NODE
      - run: npm test
      - run: npm run test:jarvis
