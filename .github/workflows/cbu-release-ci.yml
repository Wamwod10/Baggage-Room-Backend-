name: CBU FX backend checks
on:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Diagnose official CBU endpoint reachability
        run: |
          node - <<'NODE'
          (async () => {
            const paths = [
              'https://cbu.uz/uz/arkhiv-kursov-valyut/json/all/2026-10-28/',
              'https://cbu.uz/uz/arkhiv-kursov-valyut/json/',
              'https://www.cbu.uz/uz/arkhiv-kursov-valyut/json/',
              'https://cbu.uz/ru/arkhiv-kursov-valyut/json/',
            ];
            for (const url of paths) {
              try {
                const res = await fetch(url, { signal: AbortSignal.timeout(6000), headers: { Accept: 'application/json' } });
                const body = await res.text();
                const json = JSON.parse(body);
                console.log(new URL(url).host + new URL(url).pathname,
                  'status', res.status, 'jsonArray', Array.isArray(json),
                  'RUBRate', json.find?.((item) => item.Ccy === 'RUB')?.Rate ?? 'missing');
              } catch (e) {
                console.log(new URL(url).host + new URL(url).pathname, 'failed',
                  e.name, e.cause?.code || e.code || e.message);
              }
            }
          })().catch((error) => { console.error(error.message); process.exitCode = 1; });
          NODE
      - run: npm test
      - run: npm run test:jarvis

  jarvis-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fx_test
          POSTGRES_PASSWORD: local_only_test_password
          POSTGRES_DB: jarvis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fx_test -d jarvis_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # CI disposable database only. Never use a Neon/production connection here.
      JARVIS_TEST_DATABASE_URL: postgresql://fx_test:local_only_test_password@localhost:5432/jarvis_test
      DATABASE_URL: postgresql://fx_test:local_only_test_password@localhost:5432/not_application_database
      DIRECT_URL: postgresql://fx_test:local_only_test_password@localhost:5432/not_application_database
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test test/jarvisDb.test.js
