name: CBU FX backend checks
on:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      # External CBU HTTPS has repeatedly timed out from GitHub runners.
      # Only run this 6-second read-only diagnostic when explicitly requested,
      # not on every PR. Production-rate availability is verified separately.
      - name: Manual official CBU network check
        if: github.event_name == 'workflow_dispatch'
        run: |
          node - <<'NODE'
          (async () => {
            const url = 'https://cbu.uz/uz/arkhiv-kursov-valyut/json/';
            try {
              const response = await fetch(url, { signal: AbortSignal.timeout(6000) });
              const data = await response.json();
              const rub = Array.isArray(data) && data.find(row => row.Ccy === 'RUB');
              console.log(JSON.stringify({ reachable: response.ok && Boolean(rub?.Rate),
                effectiveDate: rub?.Date || null }));
            } catch (error) {
              console.log(JSON.stringify({ reachable: false, error: error.name }));
            }
          })().catch(err => { console.error(err.message); process.exitCode = 1; });
          NODE
      - run: npm test
      - run: npm run test:jarvis

  jarvis-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fx_test
          POSTGRES_PASSWORD: local_only_test_password
          POSTGRES_DB: jarvis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fx_test -d jarvis_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # CI disposable database only. Never use a Neon/production connection here.
      JARVIS_TEST_DATABASE_URL: postgresql://fx_test:local_only_test_password@localhost:5432/jarvis_test
      DATABASE_URL: postgresql://fx_test:local_only_test_password@localhost:5432/not_application_database
      DIRECT_URL: postgresql://fx_test:local_only_test_password@localhost:5432/not_application_database
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test test/jarvisDb.test.js
